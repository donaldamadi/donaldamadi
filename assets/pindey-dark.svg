<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="PinDey, live in production at pindey.app. Find your friends in a crowd, phone to phone. Where you dey? We go find you. Built end to end: a Flutter app, a Next.js website and back office, and a NestJS API.">
<style>@font-face{font-family:'GS';src:url(data:font/woff2;base64,) format('woff2');} text{font-family:'GS','Times New Roman',serif;}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s infinite ease-out}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
.arrow{transform-box:view-box;transform-origin:735px 120px;animation:hunt 9s infinite ease-in-out}
@keyframes hunt{0%{transform:rotate(-70deg)}12%{transform:rotate(35deg)}24%{transform:rotate(-20deg)}36%{transform:rotate(12deg)}50%,62%{transform:rotate(0deg);opacity:1}68%,100%{transform:rotate(0deg);opacity:0}}
.near{opacity:0;animation:near 9s infinite}
@keyframes near{0%,64%{opacity:0}70%,96%{opacity:1}100%{opacity:0}}
.d{opacity:0;animation:step 9s infinite both}.d2{animation-delay:3s}.d3{animation-delay:6s}
@keyframes step{0%{opacity:0}4%,30%{opacity:1}33%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse,.arrow,.near{animation:none}.d{animation:none}.d1{opacity:1}}
</style>
<rect x="0.5" y="0.5" width="899" height="279" rx="16" fill="#0a0a0a" stroke="#2a2a2a"/>
<rect x="20" y="20" width="860" height="240" rx="12" fill="#161616" stroke="#2a2a2a"/>
<circle class="pulse" cx="52" cy="56" r="4" fill="#34d399"/><circle cx="52" cy="56" r="4" fill="#34d399"/>
<text x="64.0" y="60.0" font-size="13" fill="#34d399" text-anchor="start" >Live in production</text>
<text x="44.0" y="118.0" font-size="46" fill="#fafafa" text-anchor="start" letter-spacing="-0.5">PinDey</text>
<text x="46.0" y="150.0" font-size="17" fill="#fafafa" text-anchor="start" >Find your friends in a crowd, phone to phone.</text>
<text x="46.0" y="176.0" font-size="15" fill="#34d399" text-anchor="start" >“Where you dey? We go find you.”</text>
<rect x="46.0" y="200" width="79.8" height="24" rx="6" fill="#1f1f1f"/>
<text x="55.0" y="216.0" font-size="12" fill="#b4b4b4" text-anchor="start" >Flutter app</text>
<rect x="133.8" y="200" width="102.5" height="24" rx="6" fill="#1f1f1f"/>
<text x="142.8" y="216.0" font-size="12" fill="#b4b4b4" text-anchor="start" >Next.js website</text>
<rect x="244.3" y="200" width="121.6" height="24" rx="6" fill="#1f1f1f"/>
<text x="253.3" y="216.0" font-size="12" fill="#b4b4b4" text-anchor="start" >Next.js back office</text>
<rect x="373.9" y="200" width="77.5" height="24" rx="6" fill="#1f1f1f"/>
<text x="382.9" y="216.0" font-size="12" fill="#b4b4b4" text-anchor="start" >NestJS API</text>
<text x="560.0" y="60.0" font-size="13" fill="#8f8f8f" text-anchor="start" >pindey.app</text>
<circle cx="735" cy="120" r="72" fill="#0a0a0a" stroke="#3a3a3a"/>
<circle cx="735" cy="120" r="48" fill="none" stroke="#2a2a2a"/>
<g class="arrow"><path transform="translate(735 120) scale(0.95)" d="M0 -50 L24 4 L7 -3 L7 44 L-7 44 L-7 -3 L-24 4 Z" fill="#34d399"/></g>
<g class="near"><circle cx="735" cy="120" r="10" fill="#34d399"/><circle cx="735" cy="120" r="26" fill="none" stroke="#34d399" stroke-opacity=".5"/></g>
<g class="d d1"><text x="735.0" y="222.0" font-size="15" fill="#fafafa" text-anchor="middle" >42 m</text><text x="735.0" y="242.0" font-size="13" fill="#b4b4b4" text-anchor="middle" >keep walking</text></g>
<g class="d d2"><text x="735.0" y="222.0" font-size="15" fill="#fafafa" text-anchor="middle" >11 m</text><text x="735.0" y="242.0" font-size="13" fill="#34d399" text-anchor="middle" >warmer</text></g>
<g class="d d3"><text x="735.0" y="222.0" font-size="15" fill="#fafafa" text-anchor="middle" >2 m</text><text x="735.0" y="242.0" font-size="13" fill="#34d399" text-anchor="middle" >very close, look around</text></g>
</svg>