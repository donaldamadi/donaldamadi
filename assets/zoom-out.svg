<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="How the job got bigger than the screen: the screen, the API, the data, the infra, the problem.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .in { animation: reveal 11s infinite both; }
    .d0 { animation-delay: 0s; }
    .d1 { animation-delay: 0.7s; }
    .d2 { animation-delay: 1.4s; }
    .d3 { animation-delay: 2.1s; }
    .d4 { animation-delay: 2.8s; }
    .d5 { animation-delay: 3.6s; }
    @keyframes reveal {
      0% { opacity: 0; }
      6% { opacity: 1; }
      88% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <rect width="900" height="470" rx="20" fill="url(#bg)"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#f8fafc">how the job got bigger than the screen</text>
  <text x="40" y="68" class="mono" font-size="13" fill="#64748b">// follow one bug far enough and you meet the whole system</text>

  <!-- concentric rings, outermost first -->
  <g transform="translate(250 270)">
    <g class="in d4">
      <circle r="190" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5"/>
      <text y="-166" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">THE PROBLEM</text>
    </g>
    <g class="in d3">
      <circle r="150" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <text y="-126" text-anchor="middle" font-size="13" font-weight="700" fill="#a5b4fc">THE INFRA</text>
    </g>
    <g class="in d2">
      <circle r="110" fill="#60a5fa" fill-opacity="0.09" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.5"/>
      <text y="-86" text-anchor="middle" font-size="13" font-weight="700" fill="#93c5fd">THE DATA</text>
    </g>
    <g class="in d1">
      <circle r="70" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>
      <text y="-47" text-anchor="middle" font-size="13" font-weight="700" fill="#7dd3fc">THE API</text>
    </g>
    <g class="in d0">
      <circle r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="-11" y="-19" width="22" height="38" rx="5" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <circle cy="13" r="1.8" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- legend, revealed in the same order -->
  <g transform="translate(490 120)">
    <g class="in d0">
      <circle cx="12" cy="0" r="12" fill="#38bdf8"/>
      <text x="12" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1120">1</text>
      <text x="36" y="-2" font-size="17" font-weight="700" fill="#f8fafc">the screen</text>
      <text x="36" y="18" font-size="13" fill="#94a3b8">Flutter, Swift, Kotlin. Years of fintech polish.</text>
    </g>
    <g class="in d1" transform="translate(0 58)">
      <circle cx="12" cy="0" r="12" fill="#38bdf8"/>
      <text x="12" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1120">2</text>
      <text x="36" y="-2" font-size="17" font-weight="700" fill="#f8fafc">the API</text>
      <text x="36" y="18" font-size="13" fill="#94a3b8">Contracts, auth, every handshake in between.</text>
    </g>
    <g class="in d2" transform="translate(0 116)">
      <circle cx="12" cy="0" r="12" fill="#60a5fa"/>
      <text x="12" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1120">3</text>
      <text x="36" y="-2" font-size="17" font-weight="700" fill="#f8fafc">the data</text>
      <text x="36" y="18" font-size="13" fill="#94a3b8">Schemas, queues, the cron job nobody remembers.</text>
    </g>
    <g class="in d3" transform="translate(0 174)">
      <circle cx="12" cy="0" r="12" fill="#818cf8"/>
      <text x="12" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1120">4</text>
      <text x="36" y="-2" font-size="17" font-weight="700" fill="#f8fafc">the infra</text>
      <text x="36" y="18" font-size="13" fill="#94a3b8">Deploys, cloud, the pager that never rings.</text>
    </g>
    <g class="in d4" transform="translate(0 232)">
      <circle cx="12" cy="0" r="12" fill="#a78bfa"/>
      <text x="12" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0b1120">5</text>
      <text x="36" y="-2" font-size="17" font-weight="700" fill="#f8fafc">the problem</text>
      <text x="36" y="18" font-size="13" fill="#94a3b8">The reason any of it should exist. Start here now.</text>
    </g>
    <text class="in d5 mono" x="0" y="300" font-size="14" font-style="italic" fill="#c4b5fd">started in the middle. still love the middle.</text>
  </g>
</svg>
